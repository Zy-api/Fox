<body>
    <div class="bg-layer">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
    </div>
    <div class="ripple-container" id="rippleContainer"></div>
    <div class="back-btn" id="backBtn" onclick="goBack()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-badge" id="badgeText">✦ PAN资源站</div>
            <h1 id="siteTitle">PAN资源站</h1>
            <p class="subtitle" id="siteSubtitle">精选网盘资源 · 一键获取</p>
            <div class="sync-badge">
                <span class="dot"></span>
                <span id="syncText">Telegram 自动同步</span>
            </div>
        </div>

        <div class="lib-title" id="libTitle">📦 资源库</div>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="num" id="totalCount">0</span>
                <span class="label">个文件</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="num" id="totalSize">0</span>
                <span class="label">MB</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="num" id="lastUpdate">-</span>
                <span class="label">更新</span>
            </div>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索资源名称..." oninput="renderFiles()">
        </div>

        <div class="file-list" id="fileList"></div>

        <p class="footer" id="footerText">所有资源均来自网络 · 仅供学习交流</p>
    </div>

    <div class="toast" id="toast"></div>

<script>
// ============================================================
// 数据读取机制（GitHub 优先 + localStorage 缓存降级）
// ============================================================
var STORAGE_KEY = 'pan_site_data';
var STORAGE_TS_KEY = 'pan_site_data_ts';
var GITHUB_DATA_URL = 'https://raw.githubusercontent.com/Zy-api/Fox/main/pan-data.json';
var CACHE_TTL = 60 * 1000; // 缓存有效期 60 秒

var defaultFiles = [
    { name: "PAN-失控进化6.5.zip", size: "325 MB", date: "2026-08-01", url: "#", tag: "最新", desc: "失控进化最新版本" },
    { name: "PAN-星辰大海3.2.zip", size: "198 MB", date: "2026-07-28", url: "#", tag: "热门", desc: "星辰大海系列" }
];

var files = [];
var settings = {};

function loadPanData() {
    try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
    } catch(e) {}
    return null;
}

function fetchGitHubData() {
    var url = GITHUB_DATA_URL + '?t=' + Date.now();
    return fetch(url, { cache: 'no-cache' })
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(STORAGE_TS_KEY, String(Date.now()));
            } catch(e) {}
            return data;
        })
        .catch(function(err) {
            console.warn('GitHub 数据获取失败:', err);
            return null;
        });
}

function isCacheExpired() {
    try {
        var ts = localStorage.getItem(STORAGE_TS_KEY);
        if (!ts) return true;
        return Date.now() - parseInt(ts) > CACHE_TTL;
    } catch(e) {
        return true;
    }
}

function isDataChanged(oldData, newData) {
    if (!oldData || !newData) return true;
    var oldFiles = oldData.files || [];
    var newFiles = newData.files || [];
    if (oldFiles.length !== newFiles.length) return true;
    for (var i = 0; i < oldFiles.length; i++) {
        if (oldFiles[i].name !== newFiles[i].name || oldFiles[i].url !== newFiles[i].url) return true;
    }
    return false;
}

function applyRemoteData(remoteData) {
    files = (remoteData.files && remoteData.files.length > 0) ? remoteData.files : defaultFiles;
    settings = remoteData.settings || {};
    if (settings.title) document.getElementById('siteTitle').textContent = settings.title;
    if (settings.subtitle) document.getElementById('siteSubtitle').textContent = settings.subtitle;
    if (settings.badgeText) document.getElementById('badgeText').textContent = settings.badgeText;
    if (settings.libTitle) document.getElementById('libTitle').textContent = settings.libTitle;
    if (settings.footer) document.getElementById('footerText').textContent = settings.footer;
    updateStats();
    renderFiles();
}

function updateStats() {
    document.getElementById('totalCount').textContent = files.length;
    var totalMB = 0;
    files.forEach(function(f) {
        var s = parseFloat(f.size) || 0;
        if (f.size && f.size.indexOf('GB') > -1) s *= 1024;
        totalMB += s;
    });
    document.getElementById('totalSize').textContent = totalMB > 1024 ? (totalMB/1024).toFixed(1) + 'G' : Math.round(totalMB);
    if (files.length > 0) {
        var latest = files[0].date || '-';
        document.getElementById('lastUpdate').textContent = latest.substring(5);
    }
}

// ============================================================
// 渲染文件列表
// ============================================================
function renderFiles() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var list = files.filter(function(f) {
        return f.name.toLowerCase().includes(q);
    });
    var html = '';
    if (!list.length) {
        html = '<div class="empty"><div class="icon">📭</div><div class="text">暂无匹配的资源</div></div>';
    } else {
        list.forEach(function(f, i) {
            var iconHtml = '';
            if (f.icon && (f.icon.indexOf('http') === 0 || f.icon.indexOf('data:') === 0)) {
                iconHtml = '<div class="file-icon img-icon"><img src="' + f.icon + '" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=\'0.3\'"></div>';
            } else {
                iconHtml = '<div class="file-icon">📦</div>';
            }
            html += '<div class="file-card">' +
                iconHtml +
                '<div class="file-info">' +
                '<div class="file-name">' + escapeHtml(f.name) + '</div>' +
                '<div class="file-meta">' +
                (f.tag ? '<span class="tag">' + escapeHtml(f.tag) + '</span>' : '') +
                '<span>' + escapeHtml(f.size || '') + '</span>' +
                (f.date ? '<span class="date">' + escapeHtml(f.date) + '</span>' : '') +
                '</div>' +
                (f.desc ? '<div style="font-size:12px;color:#8a7aaa;margin-top:4px">' + escapeHtml(f.desc) + '</div>' : '') +
                '</div>' +
                '<a class="download-btn" href="' + (f.url || '#') + '" target="_blank" rel="noopener" onclick="handleDownload(event, this)">' +
                '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
                '下载' +
                '</a>' +
                '</div>';
        });
    }
    document.getElementById('fileList').innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function handleDownload(e, btn) {
    var url = btn.getAttribute('href');
    if (!url || url === '#') {
        e.preventDefault();
        showToast('⚠️ 暂无下载链接');
        return;
    }
    showToast('⬇️ 正在跳转下载...');
}

// ============================================================
// Toast 提示
// ============================================================
var toastTimer = null;
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
        t.classList.remove('show');
    }, 2500);
}

function goBack() {
    window.history.back();
}

// ============================================================
// 监听数据变化（后台保存后自动更新）
// ============================================================
window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY && e.newValue) {
        try {
            var newData = JSON.parse(e.newValue);
            if (newData && isDataChanged({files: files}, newData)) {
                applyRemoteData(newData);
                showToast('🔄 资源已更新');
            }
        } catch(err) {}
    }
});

// ============================================================
// 初始化
// ============================================================
var panData = loadPanData();
files = (panData && panData.files && panData.files.length > 0) ? panData.files : defaultFiles;
settings = panData ? panData.settings || {} : {};

updateStats();
renderFiles();

// 后台从 GitHub 拉取最新数据
if (!panData || isCacheExpired()) {
    fetchGitHubData().then(function(remoteData) {
        if (remoteData && isDataChanged({files: files}, remoteData)) {
            applyRemoteData(remoteData);
            showToast('✨ 发现新资源');
        }
    });
}
</script>
</body>
</html>
