<body>
    <div class="bg-layer">
        <div class="bg-gradient"></div>
        <div class="stars"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-badge">✦ RESOURCE STATION</div>
            <h1>资源空间站</h1>
            <p class="subtitle">精选资源 · 极速下载 · 自动更新</p>
            <div class="sync-badge">
                <span class="dot"></span>
                <span id="syncText">自动同步中</span>
            </div>
        </div>

        <!-- 频道Tab -->
        <div class="channel-tabs" id="channelTabs">
            <div class="chan-tab active" data-chan="all" onclick="switchChannel('all')">
                <span class="emoji">✨</span>全部<span class="count" id="countAll">0</span>
            </div>
            <div class="chan-tab" data-chan="PNAyyds" onclick="switchChannel('PNAyyds')">
                <span class="emoji">💜</span>PNA<span class="count" id="countPNA">0</span>
            </div>
            <div class="chan-tab" data-chan="hhhhp" onclick="switchChannel('hhhhp')">
                <span class="emoji">🥭</span>芒果<span class="count" id="countMango">0</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="num" id="totalCount">0</span>
                <span class="label">个文件</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="num" id="totalSize">0</span>
                <span class="label">MB</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="num" id="lastUpdate">-</span>
                <span class="label">更新</span>
            </div>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索资源名称..." oninput="renderFiles()">
        </div>

        <div class="file-list" id="fileList"></div>

        <p class="footer">所有资源均来自 Telegram 频道 · 自动同步更新</p>
    </div>

    <div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'pan_site_data';
var STORAGE_TS_KEY = 'pan_site_data_ts';
var GITHUB_DATA_URL = 'https://raw.githubusercontent.com/Zy-api/Fox/main/pan-data.json';
var CACHE_TTL = 60 * 1000;

var files = [];
var settings = {};
var currentChannel = 'all';

function loadPanData() {
    try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
    } catch(e) {}
    return null;
}

function fetchGitHubData() {
    var url = GITHUB_DATA_URL + '?t=' + Date.now();
    return fetch(url, { cache: 'no-cache' })
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(STORAGE_TS_KEY, String(Date.now()));
            } catch(e) {}
            return data;
        })
        .catch(function(err) {
            console.warn('GitHub 数据获取失败:', err);
            return null;
        });
}

function isCacheExpired() {
    try {
        var ts = localStorage.getItem(STORAGE_TS_KEY);
        if (!ts) return true;
        return (Date.now() - parseInt(ts)) > CACHE_TTL;
    } catch(e) {
        return true;
    }
}

function parseSize(sizeStr) {
    if (!sizeStr) return 0;
    var m = sizeStr.toString().match(/([\d.]+)\s*(MB|GB|KB|bytes?)/i);
    if (!m) return 0;
    var num = parseFloat(m[1]);
    var unit = m[2].toUpperCase();
    if (unit.startsWith('G')) return num * 1024;
    if (unit.startsWith('K')) return num / 1024;
    return num;
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    var now = new Date();
    var diff = (now - d) / 1000;
    if (diff < 3600) return Math.floor(diff/60) + '分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + '小时前';
    if (diff < 86400*7) return Math.floor(diff/86400) + '天前';
    return dateStr.slice(5);
}

function getChannelIcon(channel) {
    if (!channel) return '📦';
    if (channel.indexOf('PNA') >= 0) return '💜';
    if (channel.indexOf('hhh') >= 0 || channel.indexOf('mango') >= 0 || channel.indexOf('芒果') >= 0) return '🥭';
    return '📦';
}

function getChannelClass(channel) {
    if (!channel) return '';
    if (channel.indexOf('PNA') >= 0) return 'pna';
    if (channel.indexOf('hhh') >= 0 || channel.indexOf('mango') >= 0 || channel.indexOf('芒果') >= 0) return 'mango';
    return '';
}

function switchChannel(chan) {
    currentChannel = chan;
    var tabs = document.querySelectorAll('.chan-tab');
    tabs.forEach(function(t) {
        t.classList.remove('active');
        if (t.dataset.chan === chan) t.classList.add('active');
    });
    renderFiles();
}

function getFilteredFiles() {
    var search = document.getElementById('searchInput').value.toLowerCase();
    return files.filter(function(f) {
        if (currentChannel !== 'all') {
            var fc = f.channel || f.tag || '';
            if (fc !== currentChannel) return false;
        }
        if (search && f.name.toLowerCase().indexOf(search) < 0) return false;
        return true;
    });
}

function renderFiles() {
    var list = document.getElementById('fileList');
    var filtered = getFilteredFiles();
    
    document.getElementById('totalCount').textContent = files.length;
    
    var totalMB = 0;
    files.forEach(function(f) { totalMB += parseSize(f.size); });
    document.getElementById('totalSize').textContent = totalMB > 1024 
        ? (totalMB/1024).toFixed(1) + 'G' 
        : Math.round(totalMB) + '';
    
    var latestDate = '';
    files.forEach(function(f) { if (f.date > latestDate) latestDate = f.date; });
    document.getElementById('lastUpdate').textContent = formatDate(latestDate);
    
    // 更新tab计数
    var countAll = files.length;
    var countPNA = files.filter(function(f){var c=f.channel||f.tag;return c&&c.indexOf('PNA')>=0}).length;
    var countMango = files.filter(function(f){var c=f.channel||f.tag;return c&&(c.indexOf('hhh')>=0||c.indexOf('芒果')>=0)}).length;
    document.getElementById('countAll').textContent = countAll;
    document.getElementById('countPNA').textContent = countPNA;
    document.getElementById('countMango').textContent = countMango;
    
    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty"><div class="icon">📭</div><div class="text">暂无文件</div></div>';
        return;
    }
    
    var html = '';
    filtered.forEach(function(f, i) {
        var chan = f.channel || f.tag || '';
        var iconCls = getChannelClass(chan);
        var icon = getChannelIcon(chan);
        var tagCls = iconCls;
        var tagName = chan;
        if (chan.indexOf('PNA') >= 0) tagName = 'PNA';
        else if (chan.indexOf('hhh') >= 0) tagName = '芒果';
        
        // 优先用 direct_url，没有就用 url
        var dlUrl = f.direct_url || f.url;
        
        html += '<div class="file-card" style="animation-delay:' + (i*0.05) + 's">';
        html += '<div class="file-icon ' + iconCls + '">' + icon + '</div>';
        html += '<div class="file-info">';
        html += '<div class="file-name">' + f.name + '</div>';
        html += '<div class="file-meta">';
        html += '<span class="tag ' + tagCls + '">' + tagName + '</span>';
        html += '<span>' + (f.size || '-') + '</span>';
        html += '<span class="date">' + formatDate(f.date) + '</span>';
        html += '</div></div>';
        html += '<a class="download-btn" href="' + dlUrl + '" target="_blank" rel="noopener">';
        html += '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';
        html += '下载</a>';
        html += '</div>';
    });
    list.innerHTML = html;
}

function init() {
    var cached = loadPanData();
    if (cached && cached.files) {
        files = cached.files || [];
        settings = cached.settings || {};
        renderFiles();
    }
    
    if (isCacheExpired() || !cached) {
        fetchGitHubData().then(function(data) {
            if (data && data.files) {
                files = data.files;
                settings = data.settings || {};
                renderFiles();
            }
        });
    }
}

init();
</script>
</body>
