<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background: #eef3f8;
            color: #1a2639;
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background:
                radial-gradient(ellipse 60% 50% at 10% 20%, rgba(180, 210, 240, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 90% 80%, rgba(200, 220, 250, 0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(160, 195, 235, 0.06) 0%, transparent 70%);
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            will-change: transform, opacity;
        }
        .glow-1 {
            width: 700px;
            height: 700px;
            top: -300px;
            left: -200px;
            background: rgba(100, 160, 255, 0.06);
            animation: glow1 18s ease-in-out infinite alternate;
        }
        .glow-2 {
            width: 600px;
            height: 600px;
            bottom: -250px;
            right: -150px;
            background: rgba(140, 180, 245, 0.05);
            animation: glow2 20s ease-in-out infinite alternate-reverse;
        }
        .glow-3 {
            width: 500px;
            height: 500px;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(120, 170, 235, 0.04);
            animation: glow3 22s ease-in-out infinite alternate;
        }

        @keyframes glow1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(120px, 80px) scale(1.3); opacity: 1; }
        }
        @keyframes glow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-100px, -120px) scale(1.4); opacity: 0.9; }
        }
        @keyframes glow3 {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.2; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.6; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            filter: blur(3px);
            animation: particleFloat 22s ease-in-out infinite alternate;
        }
        .particle-1 { width: 5px; height: 5px; top: 12%; left: 8%; animation-duration: 18s; }
        .particle-2 { width: 4px; height: 4px; top: 75%; left: 88%; animation-duration: 24s; animation-delay: 2s; }
        .particle-3 { width: 6px; height: 6px; top: 45%; left: 3%; animation-duration: 16s; animation-delay: 4s; }
        .particle-4 { width: 4px; height: 4px; top: 85%; left: 12%; animation-duration: 26s; animation-delay: 1s; }
        .particle-5 { width: 5px; height: 5px; top: 18%; left: 92%; animation-duration: 20s; animation-delay: 3s; }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            100% { transform: translate(80px, -50px) scale(1.8); opacity: 0.6; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 40px 24px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 28px;
        }

        .header-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #7a8aa8;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            margin-bottom: 14px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1a3a6a, #3a7acc, #5a9aee);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 8s ease-in-out infinite alternate;
            will-change: background-position;
            line-height: 1.2;
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #8a9bb5;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1a3a6a, #3a7acc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 8s ease-in-out infinite alternate;
            will-change: background-position;
            margin-bottom: 4px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            background-size: 200% 200%;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 14px 32px;
            border-radius: 14px;
            border: none;
            box-shadow: 0 4px 24px rgba(2, 136, 209, 0.25);
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.5s ease;
            margin: 0 auto 28px auto;
            text-decoration: none;
            letter-spacing: 0.3px;
            min-width: 160px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            animation: btnGradient 5s ease-in-out infinite;
            will-change: transform, box-shadow, background-position;
        }

        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .telegram-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(30deg) translateX(-100%);
            animation: shimmer 5s ease-in-out infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes shimmer {
            0% { transform: rotate(30deg) translateX(-100%); }
            60% { transform: rotate(30deg) translateX(100%); }
            100% { transform: rotate(30deg) translateX(100%); }
        }

        .telegram-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 44px rgba(2, 136, 209, 0.4);
        }

        .telegram-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 12px rgba(2, 136, 209, 0.2);
            transition-duration: 0.15s;
        }

        .telegram-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.8s cubic-bezier(0, 0, 0.2, 1) forwards;
            pointer-events: none;
            will-change: transform, opacity;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        .plane-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: #fff;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }

        .telegram-btn:hover .plane-icon {
            transform: translateX(4px) rotate(-8deg) scale(1.05);
        }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 8px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            width: calc(50% - 7px);
            max-width: 160px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: #1a2639;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.5s ease, background 0.5s ease, border-color 0.4s ease;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            animation: cardFadeIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            will-change: transform, box-shadow, background;
            padding: 12px 8px 8px 8px;
            text-align: center;
        }

        .card:nth-child(1) { animation-delay: 0.06s; }
        .card:nth-child(2) { animation-delay: 0.12s; }
        .card:nth-child(3) { animation-delay: 0.18s; }
        .card:nth-child(4) { animation-delay: 0.24s; }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: translateY(28px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 20px 56px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .card:active {
            transform: scale(0.94);
            transition-duration: 0.15s;
            background: rgba(255, 255, 255, 0.55);
        }

        .card .icon {
            font-size: 30px;
            margin-bottom: 0px;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .card:hover .icon {
            transform: scale(1.1) rotate(-4deg);
        }

        .card .card-name {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .download-btn {
            display: inline-block;
            margin-top: auto;
            padding: 8px 20px;
            width: 90%;
            max-width: 130px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            box-shadow: 0 2px 12px rgba(2, 136, 209, 0.2);
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.35);
        }

        .download-btn:active {
            transform: scale(0.92);
            transition-duration: 0.1s;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: rotate(25deg) translateX(-100%);
            pointer-events: none;
        }

        .download-btn:hover::before {
            animation: btnShimmer 0.6s ease-out forwards;
        }

        @keyframes btnShimmer {
            0% { transform: rotate(25deg) translateX(-100%); }
            100% { transform: rotate(25deg) translateX(100%); }
        }

        .page {
            display: none;
            animation: pageFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            width: 100%;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;

        @keyframes pageFadeIn {

        .footer {

            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 28px;
            padding-top: 18px;

            width: 100%;
            max-width: 360px;
            text-align: center;
            animation: footerFade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s both;
        }

        @keyframes footerFade {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            color: #1a2639;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.40);
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.06);
            letter-spacing: 0.2px;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .toast .dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #4fc3f7;
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .toast .dots span:nth-child(2) {
            animation-delay: 0.2s;
            background: #0288d1;
        }

        .toast .dots span:nth-child(3) {
            animation-delay: 0.4s;
            background: #4fc3f7;
        }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .swipe-bar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(180deg, rgba(43, 75, 255, 0.15), rgba(43, 75, 255, 0.05));
            border-radius: 0 4px 4px 0;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .swipe-bar.show {
            opacity: 1;
        }

        .touch-feedback {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            background: rgba(43, 75, 255, 0.03);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .touch-feedback.active {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 16px 24px; }
            .card-grid { max-width: 280px; gap: 12px; }
            .card { width: calc(50% - 6px); max-width: 130px; }
            .card .icon { font-size: 28px; }
            .card .card-name { font-size: 13px; }
            .download-btn { font-size: 12px; padding: 6px 14px; max-width: 110px; }
            h1 { font-size: 28px; }
            .page-title { font-size: 22px; }
            .swipe-bar { width: 4px; }
        }
    </style>
</head>

    <script>
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        let toastTimer = null;
        let currentPage = 1;
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        const swipeBar = document.getElementById('swipeBar');
        const touchFeedback = document.getElementById('touchFeedback');

        function showToast(text) {
            toastText.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 1500);
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            currentPage = parseInt(pageId.replace('page', ''));
            swipeBar.classList.remove('show');
        }

        // ===== 侧滑返回逻辑 =====
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = false;
            if (currentPage > 1 && touchStartX < 40) {
                swipeBar.classList.add('show');
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const deltaX = touchX - touchStartX;
            const deltaY = Math.abs(touchY - touchStartY);

            if (deltaX > 20 && deltaY < 50 && currentPage > 1) {
                isSwiping = true;
                touchFeedback.classList.add('active');
                const progress = Math.min(deltaX / 100, 1);
                touchFeedback.style.opacity = progress * 0.5;
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            const touchX = e.changedTouches[0].clientX;
            const deltaX = touchX - touchStartX;

            if (isSwiping && deltaX > 50 && currentPage > 1) {
                const pageMap = { 2: 'page1', 3: 'page1' };
                switchPage(pageMap['page' + currentPage] || 'page1');
                showToast('已返回');
            }

            isSwiping = false;
            swipeBar.classList.remove('show');
            touchFeedback.classList.remove('active');
            touchFeedback.style.opacity = 0;
        }, { passive: true });

            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
            showToast('正在跳转 Telegram 频道');
