<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资源分享</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
        body{background:#f0f4fa;color:#1a1f2e;font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:0;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;position:relative;overflow-x:hidden;display:flex;justify-content:center;align-items:flex-start}
        .bg-layer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 10% 10%,rgba(160,200,255,0.12) 0%,transparent 70%),radial-gradient(ellipse 60% 70% at 90% 90%,rgba(180,210,250,0.08) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 50% 50%,rgba(140,180,235,0.04) 0%,transparent 70%)}
        .glow{position:absolute;border-radius:50%;filter:blur(140px);will-change:transform,opacity}
        .glow-1{width:800px;height:800px;top:-400px;left:-300px;background:rgba(100,160,255,0.05);animation:g1 20s ease-in-out infinite alternate}
        .glow-2{width:700px;height:700px;bottom:-300px;right:-200px;background:rgba(140,180,245,0.04);animation:g2 22s ease-in-out infinite alternate-reverse}
        .glow-3{width:500px;height:500px;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(120,170,235,0.03);animation:g3 25s ease-in-out infinite alternate}
        @keyframes g1{0%{transform:translate(0,0) scale(1);opacity:.3}100%{transform:translate(140px,100px) scale(1.4);opacity:.8}}
        @keyframes g2{0%{transform:translate(0,0) scale(1);opacity:.2}100%{transform:translate(-120px,-140px) scale(1.5);opacity:.7}}
        @keyframes g3{0%{transform:translate(-50%,-50%) scale(.7);opacity:.1}100%{transform:translate(-50%,-50%) scale(1.6);opacity:.5}}
        .particle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.2);filter:blur(4px);animation:pf 25s ease-in-out infinite alternate}
        .particle-1{width:6px;height:6px;top:10%;left:6%;animation-duration:20s}
        .particle-2{width:5px;height:5px;top:78%;left:90%;animation-duration:26s;animation-delay:2s}
        .particle-3{width:7px;height:7px;top:42%;left:2%;animation-duration:18s;animation-delay:4s}
        .particle-4{width:4px;height:4px;top:88%;left:10%;animation-duration:28s;animation-delay:1s}
        .particle-5{width:6px;height:6px;top:15%;left:94%;animation-duration:22s;animation-delay:3s}
        @keyframes pf{0%{transform:translate(0,0) scale(1);opacity:.1}100%{transform:translate(90px,-60px) scale(2);opacity:.5}}
        .container{position:relative;z-index:1;width:100%;max-width:420px;padding:32px 20px 30px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
        .back-btn{position:fixed;top:8px;left:20px;z-index:200;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.35);box-shadow:0 4px 16px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .25s ease,transform .25s ease;opacity:0;pointer-events:none;transform:scale(.85);will-change:transform,opacity}
        .back-btn.show{opacity:1;pointer-events:auto;transform:scale(1)}
        .back-btn:active{transform:scale(.88)}
        .back-btn svg{width:22px;height:22px;fill:none;stroke:#1a1f2e;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
        .back-btn .ripple{position:absolute;border-radius:50%;background:rgba(43,75,255,0.1);transform:scale(0);animation:ra .6s cubic-bezier(0,0,.2,1) forwards;pointer-events:none;will-change:transform,opacity}
        @keyframes ra{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
        .header{width:100%;text-align:center;margin-bottom:20px;padding-top:4px}
        .header-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7a8aa8;background:rgba(255,255,255,0.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.3);margin-bottom:12px}
        h1{font-size:34px;font-weight:700;letter-spacing:-.8px;background:linear-gradient(135deg,#162b4a,#2a6bb0,#4a8fd4);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tg 10s ease-in-out infinite alternate;line-height:1.15}
        @keyframes tg{0%{background-position:0% 50%}100%{background-position:100% 50%}}
        .subtitle{font-size:14px;font-weight:400;color:#8a9bb8;margin-top:6px;letter-spacing:.5px}
        
        /* 安全认证 - 使用蓝色SVG图标 */
        .security-badge{width:100%;max-width:320px;margin:0 auto 20px;padding:12px 20px;background:rgba(255,255,255,0.35);backdrop-filter:blur(24px);border-radius:16px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;gap:16px;transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden}
        .security-badge::before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,0.2) 0%,transparent 60%);pointer-events:none}
        .security-badge::after{content:'';position:absolute;top:-50%;right:-30%;width:80%;height:200%;background:radial-gradient(ellipse,rgba(79,195,247,0.04) 0%,transparent 70%);pointer-events:none;animation:sg 8s ease-in-out infinite alternate}
        @keyframes sg{0%{transform:translate(0,0) scale(1);opacity:.5}100%{transform:translate(-40px,-20px) scale(1.6);opacity:1}}
        .security-badge:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 40px rgba(0,0,0,0.08);border-color:rgba(255,255,255,0.5)}
        .sec-item{display:flex;align-items:center;gap:8px;font-size:15px;color:#5a6a7a;position:relative;z-index:1}
        .sec-item .sec-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;color:#3a7acc}
        .sec-item .sec-icon svg{width:24px;height:24px;stroke:#3a7acc;stroke-width:2;fill:none}
        .sec-item .sec-text{font-weight:600;color:#1a1f2e}
        .sec-divider{width:1px;height:20px;background:rgba(0,0,0,0.06);position:relative;z-index:1}
        
        .page-title{font-size:28px;font-weight:600;letter-spacing:-.5px;background:linear-gradient(135deg,#162b4a,#2a6bb0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tg 10s ease-in-out infinite alternate;margin-bottom:6px}
        .telegram-btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#4fc3f7,#0277bd);background-size:200% 200%;color:#fff;font-size:16px;font-weight:600;font-family:'Inter',sans-serif;padding:14px 34px;border-radius:50px;border:none;box-shadow:0 6px 32px rgba(2,136,209,0.3),inset 0 1px 0 rgba(255,255,255,0.15);cursor:pointer;transition:transform .3s,box-shadow .3s;margin:0 auto 20px;text-decoration:none;letter-spacing:.3px;min-width:170px;position:relative;overflow:hidden;user-select:none;animation:bg 6s ease-in-out infinite;will-change:transform,box-shadow,background-position}
        @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .telegram-btn::before{content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transform:rotate(30deg) translateX(-100%);animation:sh 6s ease-in-out infinite;pointer-events:none}
        @keyframes sh{0%{transform:rotate(30deg) translateX(-100%)}60%{transform:rotate(30deg) translateX(100%)}100%{transform:rotate(30deg) translateX(100%)}}
        .telegram-btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 14px 52px rgba(2,136,209,0.45),inset 0 1px 0 rgba(255,255,255,0.15)}
        .telegram-btn:active{transform:scale(.92)}
        .telegram-btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.3);transform:scale(0);animation:rb .7s cubic-bezier(0,0,.2,1) forwards;pointer-events:none}
        @keyframes rb{0%{transform:scale(0);opacity:1}100%{transform:scale(5);opacity:0}}
        .plane-icon{width:20px;height:20px;flex-shrink:0;fill:#fff;transition:transform .3s}
        .telegram-btn:hover .plane-icon{transform:translateX(5px) rotate(-10deg) scale(1.08)}
        .card-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:380px;margin:0 auto 12px}
        .card{background:rgba(255,255,255,0.45);backdrop-filter:blur(36px);border-radius:24px;border:1px solid rgba(255,255,255,0.35);box-shadow:0 12px 40px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.8);width:calc(50% - 8px);max-width:170px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:500;letter-spacing:-.2px;color:#1a1f2e;cursor:default;transition:transform .3s,box-shadow .3s,background .3s;position:relative;overflow:hidden;user-select:none;animation:cf .6s cubic-bezier(.25,.46,.45,.94) both;will-change:transform,box-shadow,background;padding:14px 10px 10px;text-align:center}
        .card::after{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 50%);pointer-events:none}
        .card:nth-child(1){animation-delay:.04s}
        .card:nth-child(2){animation-delay:.08s}
        .card:nth-child(3){animation-delay:.12s}
        .card:nth-child(4){animation-delay:.16s}
        @keyframes cf{0%{opacity:0;transform:translateY(30px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
        .card:hover{transform:translateY(-6px) scale(1.04);background:rgba(255,255,255,0.8);box-shadow:0 24px 64px rgba(0,0,0,0.1),inset 0 1px 0 rgba(255,255,255,0.9);border-color:rgba(255,255,255,0.6)}
        .card:active{transform:scale(.92)}
        .card .icon{font-size:32px;margin-bottom:0;transition:transform .3s;pointer-events:none;position:relative;z-index:1}
        .card:hover .icon{transform:scale(1.12) rotate(-4deg)}
        .card .icon-img{width:52px;height:52px;object-fit:contain;margin-bottom:2px;pointer-events:none;transition:transform .3s;border-radius:10px;position:relative;z-index:1}
        .card:hover .icon-img{transform:scale(1.12) rotate(-4deg)}
        .card .card-name{font-size:14px;font-weight:500;text-align:center;line-height:1.3;margin-bottom:4px;pointer-events:none;position:relative;z-index:1}
        .download-btn{display:inline-block;margin-top:auto;padding:9px 20px;width:90%;max-width:130px;background:linear-gradient(135deg,#4fc3f7,#0277bd);color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;border-radius:50px;border:none;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background .3s;box-shadow:0 4px 16px rgba(2,136,209,0.2);letter-spacing:.3px;user-select:none;position:relative;overflow:hidden;text-align:center;z-index:2}
        .download-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 32px rgba(2,136,209,0.35)}
        .download-btn:active{transform:scale(.92)!important;transition-duration:.08s}
        .download-btn::before{content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);transform:rotate(25deg) translateX(-100%);pointer-events:none}
        .download-btn:hover::before{animation:bs .6s ease-out forwards}
        @keyframes bs{0%{transform:rotate(25deg) translateX(-100%)}100%{transform:rotate(25deg) translateX(100%)}}
        .page{display:none;animation:pfade .35s cubic-bezier(.25,.46,.45,.94) forwards;width:100%}
        .page.active{display:flex;flex-direction:column;align-items:center}
        @keyframes pfade{0%{opacity:0;transform:translateY(16px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
        .footer{color:#8a9bb8;font-size:12px;font-weight:400;letter-spacing:.6px;margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.3);width:100%;max-width:360px;text-align:center}
        .toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%) translateY(30px) scale(.92);background:rgba(255,255,255,0.75);backdrop-filter:blur(40px);color:#1a1f2e;padding:14px 28px;border-radius:50px;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s,box-shadow .3s;z-index:999;border:1px solid rgba(255,255,255,0.5);box-shadow:0 16px 56px rgba(0,0,0,0.08);letter-spacing:.2px;white-space:nowrap;will-change:transform,opacity}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);box-shadow:0 20px 64px rgba(0,0,0,0.12)}
        .toast .dots{display:inline-flex;gap:5px;margin-left:10px}
        .toast .dots span{display:inline-block;width:6px;height:6px;background:#4fc3f7;border-radius:50%;animation:db 1.4s ease-in-out infinite;will-change:transform,opacity}
        .toast .dots span:nth-child(2){animation-delay:.2s;background:#0277bd}
        .toast .dots span:nth-child(3){animation-delay:.4s;background:#4fc3f7}
        @keyframes db{0%,80%,100%{transform:scale(.5) translateY(0);opacity:.3}40%{transform:scale(1.2) translateY(-4px);opacity:1}}
        .lib-title{font-size:24px;font-weight:700;text-align:center;background:linear-gradient(135deg,#162b4a,#2a6bb0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;width:100%;margin-bottom:4px;letter-spacing:-.5px;padding-top:20px}
        .stats-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;padding:8px 20px;background:rgba(255,255,255,0.4);backdrop-filter:blur(20px);border-radius:50px;border:1px solid rgba(255,255,255,0.35);box-shadow:0 4px 24px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.6);width:100%;max-width:380px}
        .stats-bar .stat-divider{width:1px;height:20px;background:rgba(0,0,0,0.06)}
        .stats-bar .stat-item{display:flex;align-items:baseline;gap:4px}
        .stats-bar .stat-item .num{font-weight:700;font-size:15px;color:#1a1f2e;letter-spacing:-.3px}
        .stats-bar .stat-item .label{font-size:12px;color:#8a9bb8;font-weight:400}
        .app-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
        .app-card{background:rgba(255,255,255,0.5);backdrop-filter:blur(24px);border-radius:18px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.04);padding:14px 16px;display:flex;align-items:center;gap:14px;transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden}
        .app-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,transparent 60%);pointer-events:none;border-radius:18px}
        .app-card:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,0.08);background:rgba(255,255,255,0.75)}
        .app-icon{width:50px;height:50px;border-radius:12px;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,0.3);padding:4px;position:relative;z-index:1}
        .app-info{flex:1;min-width:0;position:relative;z-index:1}
        .app-info .app-name{font-size:15px;font-weight:600;color:#1a1f2e}
        .app-info .app-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:#8a9bb8;margin-top:2px;flex-wrap:wrap}
        .app-info .app-meta .tag{background:rgba(79,195,247,0.12);color:#0277bd;padding:2px 8px;border-radius:30px;font-size:9px;font-weight:600}
        .app-info .app-desc{font-size:11px;color:#6a7a8a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .app-action{flex-shrink:0;position:relative;z-index:1}
        .app-download-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 18px;min-width:70px;height:38px;background:linear-gradient(135deg,#4fc3f7,#0277bd);background-size:200% 200%;color:#fff;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;border-radius:50px;border:none;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;box-shadow:0 4px 16px rgba(2,136,209,0.2);white-space:nowrap;animation:bg 5s ease-in-out infinite;position:relative;overflow:hidden}
        .app-download-btn:active{transform:scale(.92)!important;transition-duration:.08s}
        .app-download-btn::before{content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transform:rotate(30deg) translateX(-100%);animation:sh 5s ease-in-out infinite;pointer-events:none}
        .app-download-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 28px rgba(2,136,209,0.35)}
        .app-download-btn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .app-download-btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.3);transform:scale(0);animation:rb .7s cubic-bezier(0,0,.2,1) forwards;pointer-events:none;will-change:transform,opacity}
        @media (max-width:480px){.container{padding:20px 16px 24px;max-width:100%}.back-btn{top:6px;left:14px;width:40px;height:40px}.back-btn svg{width:18px;height:18px}.card-grid{max-width:320px;gap:14px}.card{width:calc(50% - 7px);max-width:145px}.card .icon{font-size:28px}.card .icon-img{width:44px;height:44px}.card .card-name{font-size:13px}.download-btn{font-size:12px;padding:7px 14px;max-width:110px}h1{font-size:30px}.page-title{font-size:24px}.telegram-btn{padding:12px 24px;font-size:15px;min-width:150px}.toast{padding:12px 20px;font-size:13px;white-space:normal;max-width:85%;border-radius:40px}.security-badge{padding:10px 16px;max-width:280px;gap:10px}.sec-item{font-size:13px}.sec-item .sec-icon{width:20px;height:20px}.sec-item .sec-icon svg{width:20px;height:20px}.stats-bar{padding:6px 16px;gap:12px}.stats-bar .stat-item .num{font-size:13px}.stats-bar .stat-item .label{font-size:11px}.lib-title{font-size:20px;padding-top:12px}.app-list{max-width:100%}.app-card{padding:12px 12px;gap:10px}.app-icon{width:44px;height:44px}.app-info .app-name{font-size:14px}.app-download-btn{padding:6px 14px;font-size:12px;height:34px;min-width:60px}}
    </style>
</head>
<body>

<div class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div class="bg-layer">
    <div class="glow glow-1"></div><div class="glow glow-2"></div><div class="glow glow-3"></div>
    <div class="particle particle-1"></div><div class="particle particle-2"></div><div class="particle particle-3"></div>
    <div class="particle particle-4"></div><div class="particle particle-5"></div>
</div>

<div class="toast" id="toast">
    <span id="toastText">正在跳转</span>
    <span class="dots"><span></span><span></span><span></span></span>
</div>

<div class="container" id="container">

    <!-- ===== 页面1：主页面 ===== -->
    <div id="page1" class="page active" data-page="1">
        <div class="header">
            <div class="header-badge" id="badgeText">✦ 资源站</div>
            <h1 id="siteTitle">资源分享</h1>
            <p class="subtitle" id="siteSubtitle">精选实用工具 · 一键获取</p>
        </div>

        <!-- 安全认证展示 - 蓝色SVG图标 -->
        <div class="security-badge">
            <span class="sec-item">
                <span class="sec-icon" id="securityIconDisplay">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                </span>
                <span class="sec-text" id="securityText">安全认证</span>
            </span>
            <span class="sec-divider"></span>
            <span class="sec-item">
                <span class="sec-icon" id="officialIconDisplay">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 5L3 9v6l8 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </span>
                <span class="sec-text" id="officialText">官方渠道</span>
            </span>
        </div>

        <div class="telegram-btn" id="telegramBtnTop">
            <svg class="plane-icon" viewBox="0 0 24 24"><path d="M1.5 11.5L21 3L16.5 21L12.5 13.5L8 17L8.5 11.5L18 6.5L11 11L1.5 11.5Z"/></svg>
            Telegram
        </div>

        <div class="card-grid" id="homeCardGrid">
        </div>

        <p class="footer" id="footerText">所有软件均来自官方渠道 · 安全无毒</p>
    </div>

    <!-- ===== 页面2：软件库 ===== -->
    <div id="page2" class="page" data-page="2">

// ============================================================
// 数据读取机制（GitHub 优先 + localStorage 缓存降级）
// ============================================================
var STORAGE_KEY = 'resource_admin_data';
var STORAGE_TS_KEY = 'resource_admin_data_ts'; // 缓存时间戳
var GITHUB_DATA_URL = 'https://raw.githubusercontent.com/Zy-api/Fox/main/data.json';
var CACHE_TTL = 30 * 1000; // 缓存有效期 30 秒（后台保存后前台刷新即可看到更新）

/**
 * 同步从 localStorage 读取缓存数据（用于快速首屏渲染）
 */
function loadAdminData() {
    try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            return JSON.parse(stored);
        }
    } catch(e) {}
    return null;
}

/**
 * 从 GitHub 远程获取 data.json
 * 成功后缓存到 localStorage 并记录时间戳
 * @returns {Promise<Object|null>}
 */
function fetchGitHubData() {
    // 加时间戳参数绕过 CDN 缓存，确保拿到最新数据
    var url = GITHUB_DATA_URL + '?t=' + Date.now();
    return fetch(url, { cache: 'no-cache' })
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            try {
                // 将 GitHub 数据写入 localStorage 缓存
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(STORAGE_TS_KEY, String(Date.now()));
            } catch(e) {
                // localStorage 写入失败（如存储满），不影响使用
                console.warn('缓存写入失败:', e);
            }
            return data;
        })
        .catch(function(err) {
            console.warn('GitHub 数据获取失败，使用缓存/默认数据:', err);
            return null;
        });
}

/**
 * 检查缓存是否过期
 * @returns {boolean}
 */
function isCacheExpired() {
    try {
        var ts = localStorage.getItem(STORAGE_TS_KEY);
        if (!ts) return true;
        return (Date.now() - parseInt(ts)) > CACHE_TTL;
    } catch(e) {
        return true;
    }
}

/**
 * 比较两份数据是否有实质变化（用于判断是否需要重新渲染）
 * @param {Object|null} a
 * @param {Object|null} b
 * @returns {boolean}
 */
function isDataChanged(oldData, newData) {
    if (!oldData && !newData) return false;
    if (!oldData || !newData) return true;
    return JSON.stringify(oldData) !== JSON.stringify(newData);
}

function switchPage(pageId) {
    history.pushState({ page: pageId }, '', '?page=' + pageId);
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove('active');
    }
    document.getElementById(pageId).classList.add('active');
    currentPage = parseInt(pageId.replace('page', ''));
    if (currentPage === 1) {
        backBtn.classList.remove('show');
    } else {
        backBtn.classList.add('show');
    }
}

backBtn.addEventListener('click', function(e) {
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var rect = this.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    this.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
    if (currentPage > 1) {
        switchPage('page1');
        showToast('已返回');
    }
});

        var name = card ? card.querySelector('.card-name').textContent : '文件';
        showToast('正在下载 ' + name);
        // 不阻止默认行为，让 <a> 标签正常打开链接
        return;
    }
});

backBtn.classList.remove('show');

// ===== 监听 localStorage 变化，后台保存数据后实时更新前台 =====
window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY && e.newValue) {
        try {
            var newData = JSON.parse(e.newValue);
            if (newData && isDataChanged(adminData, newData)) {
                applyRemoteData(newData);
            }
        } catch(err) {}
    }
});
</script>
