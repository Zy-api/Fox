name: Gen Session
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'send_code or login'
        required: true
        default: 'send_code'
        type: choice
        options:
          - send_code
          - login
      code:
        description: 'verification code'
        required: false
      hash:
        description: 'phone_code_hash from send_code'
        required: false
      pwd:
        description: '2FA password (if any)'
        required: false
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install telethon
      - env:
          ACTION: ${{ inputs.action }}
          CODE: ${{ inputs.code }}
          PHONE_CODE_HASH: ${{ inputs.hash }}
          PASSWORD: ${{ inputs.pwd }}
        run: python3 generate_session.py

